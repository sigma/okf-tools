name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: gofmt / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      # -count=1 disables the test result cache so the import-boundary tests in
      # internal/publish (which shell out to `go list`) always re-run; a warm
      # GOCACHE could otherwise report a stale pass after a boundary violation.
      - run: go test -count=1 ./...

  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    # The job itself always runs so it always reports a `nix flake check` status
    # — a `paths:` filter on the trigger would skip the whole run (and the status),
    # which a branch-protection required check reads as "pending" and never merges.
    # Instead we gate the expensive Nix steps on an in-job path filter: irrelevant
    # changes still get a green `nix flake check`, just without the build/test cost.
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Inputs that can actually change what `nix flake check` builds/tests:
          # the flake, its lock, and the Go module (built by the package's doCheck).
          # The workflow itself is included so changes to this job stay self-checking.
          filters: |
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'go.mod'
              - 'go.sum'
              - '**/*.go'
              - '.github/workflows/ci.yml'
      - uses: DeterminateSystems/nix-installer-action@main
        if: steps.filter.outputs.nix == 'true'
      - uses: DeterminateSystems/magic-nix-cache-action@main
        if: steps.filter.outputs.nix == 'true'
      # Builds okftool and runs the full go test suite via the package's doCheck.
      - if: steps.filter.outputs.nix == 'true'
        run: nix flake check -L
